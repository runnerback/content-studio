name: Release Package

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate versions.json mapping
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          MANIFEST_MIN_APP_VERSION="$(node -p "require('./manifest.json').minAppVersion")"
          VERSION_MAP="$(node -p "const v=require('./versions.json'); v[require('./manifest.json').version] || ''")"

          if [ -z "$VERSION_MAP" ]; then
            echo "versions.json missing entry for $MANIFEST_VERSION"
            exit 1
          fi

          if [ "$VERSION_MAP" != "$MANIFEST_MIN_APP_VERSION" ]; then
            echo "versions.json mapping mismatch: expected $MANIFEST_VERSION -> $MANIFEST_MIN_APP_VERSION, got $VERSION_MAP"
            exit 1
          fi

      - name: Validate tag/version consistency
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [[ "$TAG" == v* ]]; then
            echo "Release tags must match manifest version exactly and must not use a v prefix."
            echo "Use $MANIFEST_VERSION instead of v$MANIFEST_VERSION."
            exit 1
          fi

          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG) does not match manifest version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Setup Mock for CI
        run: |
          mkdir -p node_modules/obsidian
          cp __mocks__/obsidian.js node_modules/obsidian/index.js

      - name: Obsidian scan readiness guard
        run: npm run review:guard

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES_FILE="RELEASE_NOTES/v${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            # Extract title from YAML front matter
            TITLE=$(sed -n 's/^title: *//p' "$NOTES_FILE" | head -1)
            echo "title=$TITLE" >> $GITHUB_OUTPUT

            # Extract body (everything after the second ---)
            # Use awk to get content after the closing front matter delimiter
            awk '/^---$/{n++;next} n>=2' "$NOTES_FILE" > /tmp/release_body.md
            echo "body_file=/tmp/release_body.md" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Found release notes: $NOTES_FILE"
            echo "Title: $TITLE"
            echo "Body preview:"
            head -5 /tmp/release_body.md
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ Release notes file not found: $NOTES_FILE"
          fi

      - name: Attest release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # 先建草稿并挂上三件套，校验齐全后再发布：Obsidian 社区目录在 release「published」事件时立刻拉取资产，
      # 直接发布会撞上资产还在上传的窗口（3.11.10 审核判「缺 main.js / manifest.json」，而几秒后资产其实都在）。
      - name: Create GitHub release (draft with assets)
        if: startsWith(github.ref, 'refs/tags/')
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ github.ref_name }}${{ steps.release_notes.outputs.found == 'true' && format(' - {0}', steps.release_notes.outputs.title) || '' }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify assets then publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.gh_release.outputs.id }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          AUTH=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json")
          NAMES="$(curl -sSf "${AUTH[@]}" "${API}/assets" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).map(a=>a.name+":"+a.state).sort().join(" ")))')"
          echo "release assets: ${NAMES}"
          for f in main.js manifest.json styles.css; do
            case " ${NAMES} " in *" ${f}:uploaded "*) ;; *) echo "asset ${f} 未挂到草稿 Release 上，拒绝发布"; exit 1 ;; esac
          done
          curl -sSf "${AUTH[@]}" -X PATCH "${API}" -d '{"draft": false}' > /dev/null
          echo "published release ${RELEASE_ID} with ${NAMES}"

      # Obsidian 社区目录按 tag 查 Release；GitHub 按 tag 的记录在发布后常要 1~2 小时才带上资产
      # （2026-09-23：3.11.10 / 3.11.11 发布后按 id 查资产齐全、按 tag 查为空，目录据此误判「缺 main.js」）。
      # 这里轮询 10 分钟并把结果写进任务注解：未同步不算失败（Release 本身没问题），但要提醒去目录点 Request review。
      - name: Check release-by-tag index (what the Obsidian directory reads)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          for i in $(seq 1 20); do
            COUNT="$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${API}" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log((JSON.parse(d).assets||[]).length))')"
            echo "attempt ${i}: releases/tags/${GITHUB_REF_NAME} embeds ${COUNT} assets"
            if [ "${COUNT}" = "3" ]; then echo "::notice::按 tag 查询已带上 3 个资产，社区目录可正常审核"; exit 0; fi
            sleep 30
          done
          echo "::warning::GitHub 按 tag 查询的 Release 记录仍未带上资产（资产本身已上传）。社区目录此刻审核会误报缺 main.js / manifest.json；通常 1~2 小时后同步，届时到 community.obsidian.md 插件页「···」→「Request review」重审即可。"
